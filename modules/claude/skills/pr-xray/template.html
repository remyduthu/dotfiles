<title>TITLE — #NUMBER plus the plain-language subject</title>
<style>
  :root {
    color-scheme: light;
    --bg: #faf9f7;
    --surface: #ffffff;
    --sunk: #f3f1ec;
    --ink: #15171c;
    --muted: #5f6673;
    --line: #e3e0d9;
    --accent: #2f4fd0;
    --before: #857f76;
    --after: #1c7a52;
    --warn: #8a5d00;
    --warn-bg: #fbf1d6;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1116;
      --surface: #171a21;
      --sunk: #1d212a;
      --ink: #e7e9ee;
      --muted: #98a0ae;
      --line: #272c36;
      --accent: #90a6ff;
      --before: #8b93a1;
      --after: #5cbe8a;
      --warn: #d7a446;
      --warn-bg: #2a2314;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1116;
    --surface: #171a21;
    --sunk: #1d212a;
    --ink: #e7e9ee;
    --muted: #98a0ae;
    --line: #272c36;
    --accent: #90a6ff;
    --before: #8b93a1;
    --after: #5cbe8a;
    --warn: #d7a446;
    --warn-bg: #2a2314;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.62 var(--sans);
    margin: 0;
    padding: 3.5rem 1.25rem 6rem;
    -webkit-font-smoothing: antialiased;
  }

  main { margin: 0 auto; max-width: 54rem; }

  /* Masthead. */
  .pr-id {
    align-items: center;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    font: 500 0.8rem/1 var(--mono);
    gap: 0.5rem 0.9rem;
    letter-spacing: 0.02em;
  }
  .pr-id a { color: var(--accent); text-decoration: none; }
  .pr-id a:hover { text-decoration: underline; }
  .pr-id .state {
    background: var(--sunk);
    border-radius: 999px;
    padding: 0.22rem 0.6rem;
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(1.75rem, 4.5vw, 2.6rem);
    font-weight: 640;
    letter-spacing: -0.022em;
    line-height: 1.15;
    margin: 0.85rem 0 0;
    text-wrap: balance;
  }

  /* Sections. */
  section { border-top: 1px solid var(--line); margin-top: 3.25rem; padding-top: 1.6rem; }
  section:first-of-type { border-top: 0; margin-top: 2rem; padding-top: 0; }
  h2 {
    color: var(--muted);
    font: 600 0.72rem/1 var(--sans);
    letter-spacing: 0.14em;
    margin: 0 0 1.1rem;
    text-transform: uppercase;
  }
  .lead { font-size: 1.12rem; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  p:last-child { margin-bottom: 0; }

  /* Vocabulary. */
  dl { display: grid; gap: 0.55rem 1.4rem; grid-template-columns: max-content 1fr; margin: 0; }
  dt { color: var(--ink); font: 600 0.92rem/1.6 var(--mono); }
  dd { color: var(--muted); margin: 0; }
  @media (max-width: 34rem) {
    dl { grid-template-columns: 1fr; }
    dd { margin-bottom: 0.7rem; }
  }

  /* Mechanism. */
  .mechanism {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 1.5rem;
    padding: 1.5rem 1.6rem;
  }
  .mechanism > h3 {
    font-size: 1.16rem;
    font-weight: 620;
    letter-spacing: -0.012em;
    margin: 0 0 0.7rem;
  }
  .mechanism > p { color: var(--muted); }

  .sides { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; margin: 1.4rem 0 0; }
  @media (max-width: 44rem) { .sides { grid-template-columns: 1fr; } }
  .side {
    background: var(--sunk);
    border-radius: 9px;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 1rem;
  }
  .side.before { --side: var(--before); }
  .side.after { --side: var(--after); }
  .side > h4 {
    color: var(--side);
    font: 600 0.68rem/1 var(--sans);
    letter-spacing: 0.13em;
    margin: 0 0 0.15rem;
    text-transform: uppercase;
  }

  .node {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 0.9rem;
    padding: 0.55rem 0.75rem;
  }
  .node.mark { border-color: var(--side); box-shadow: inset 3px 0 0 var(--side); }
  .node code { font: 0.85em var(--mono); }
  .node small { color: var(--muted); display: block; font-size: 0.8rem; line-height: 1.45; }
  .arrow { color: var(--muted); font-size: 0.8rem; margin: -0.2rem 0; text-align: center; }

  .effect { border-top: 1px dashed var(--line); font-size: 0.95rem; margin-top: 1.3rem; padding-top: 1rem; }
  .effect strong { font-weight: 620; }

  .unverified {
    background: var(--warn-bg);
    border-radius: 5px;
    color: var(--warn);
    font: 600 0.68rem/1 var(--sans);
    letter-spacing: 0.08em;
    padding: 0.24rem 0.45rem;
    text-transform: uppercase;
    vertical-align: 0.1em;
    white-space: nowrap;
  }

  pre.mermaid {
    background: var(--sunk);
    border-radius: 9px;
    margin: 1.4rem 0 0;
    overflow-x: auto;
    padding: 1.1rem;
    text-align: center;
  }
</style>

<main>

  <!-- REASON. The identity line, then Step 2's paragraph — what the code used to be able
       to assume and no longer can, or what the system could not do and now must. This is
       the part read first and skipped most; give it room. -->
  <header>
    <div class="pr-id">
      <a href="URL">#NUMBER</a>
      <span>AUTHOR</span>
      <span>into BASE</span>
      <span class="state">STATE</span>
    </div>
    <h1>PLAIN-LANGUAGE SUBJECT</h1>
  </header>
  <section>
    <h2>Why this had to change</h2>
    <p class="lead">…</p>
  </section>

  <!-- VOCABULARY. Three to six domain terms the page cannot avoid, one plain line each.
       Only terms the page actually uses. Delete the section when it needs none. -->
  <section>
    <h2>Vocabulary</h2>
    <dl>
      <dt>term</dt><dd>…</dd>
    </dl>
  </section>

  <!-- MECHANISMS. One .mechanism per thing the system now does differently.
       Title says what changes, not which function. Repeat .node freely inside a side —
       under ten each, <span class="arrow">↓</span> between them, .mark on what differs.
       Swap both sides for one <pre class="mermaid"> flowchart when the change really is
       different boxes and arrows rather than the same shape marked differently.
       Tag a path you could not confirm from the code: <span class="unverified">unverified</span>. -->
  <section>
    <h2>What changes</h2>
    <article class="mechanism">
      <h3>…</h3>
      <p>…</p>
      <div class="sides">
        <div class="side before">
          <h4>Before</h4>
          <div class="node">…</div>
        </div>
        <div class="side after">
          <h4>After</h4>
          <div class="node mark">…<small>…</small></div>
        </div>
      </div>
      <p class="effect"><strong>For a user:</strong> …</p>
    </article>
  </section>

  <!-- WORTH KNOWING. Prose, not a findings list: what would surprise the reader, what the
       description claims that the code does not do, what the change leaves untouched.
       Say there is nothing when there is nothing. -->
  <section>
    <h2>Worth knowing</h2>
    <p>…</p>
  </section>

</main>
